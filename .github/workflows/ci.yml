name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Test tooling only (jsdom); the extension itself has no dependencies.
      - name: Install test dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Package
        run: |
          npm run package
          npm run package:store

      - uses: actions/upload-artifact@v4
        with:
          name: connectpilot-extension
          path: dist/*.zip
          if-no-files-found: error
